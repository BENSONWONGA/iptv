name: odk-erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 12

  odoo:
    image: odoo:20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: odoo -d odk_erp
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odk-web:/var/lib/odoo
    environment:
      TZ: Asia/Shanghai

volumes:
  odk-db:
  odk-web:
